[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "truthlens"
version = "0.9.0"
description = "TruthLens local multimodal screening prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.10.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]
